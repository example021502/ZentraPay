group 'com.paystack.paystack_flutter'
version '1.0-SNAPSHOT'

// Local copy of paystack_flutter_sdk 0.0.1-alpha.2, patched for Flutter's
// Built-in Kotlin migration: the original applied the Kotlin Gradle Plugin
// (kotlin-android) and pinned Kotlin 1.7.10 / AGP 7.3.0 through its own
// buildscript. With AGP 9 Built-in Kotlin the library's Kotlin sources are
// compiled by AGP, so those are dropped. Re-check upstream before replacing this
// copy with a newer pub.dev release.

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.paystack.paystack_sdk'

    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 23
    }

    dependencies {
        implementation 'com.paystack.android:paystack-ui:0.0.8'
    }
}
