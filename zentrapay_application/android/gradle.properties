# This machine has 7.89 GB of RAM across 4 logical cores. The previous values
# (-Xmx8G -XX:MaxMetaspaceSize=4G = 12.5 GB) asked for more memory than the
# whole box has, which made the JVM die with "Native memory allocation (malloc)
# failed" (see hs_err_pid*.log) and left the Kotlin compile daemon unable to
# start. Keep the JVM well under physical RAM and avoid extra JVMs.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
# Only 4 cores: parallel workers multiply peak memory, so keep it serial.
org.gradle.parallel=false
org.gradle.workers.max=2
# Compile Kotlin inside the Gradle daemon instead of spawning a second JVM
# that the box is too small to host (fixes "Could not connect to Kotlin
# compile daemon").
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
# This network reaches Maven Central / Google / the plugin portal, but slowly
# enough that Gradle's default 30s socket timeout aborts downloads with
# "Read timed out" mid-resolution (which then disables the whole repository
# for the build). Give slow artifact downloads room to finish.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
android.useAndroidX=true
# Gradle 9's "problems report" step fails this build AFTER compilation
# succeeds, with:
#   java.nio.file.FileAlreadyExistsException:
#   ...\.gradle\.tmp\problems-report<N>.html
#     -> build\reports\problems\problems-report.html
# It cannot overwrite a problems-report.html left behind by a previous run, sfo
# `flutter build apk` reports BUILD FAILED even though app-debug.apk was written
# correctly (verified: valid zip, classes.dex + libflutter.so + manifest all
# present). Turning the report off removes the spurious failure without
# affecting compilation or packaging.
org.gradle.problems.report=false
# Both flags below are the Flutter template defaults and MUST stay at false for
# this project. AGP 9 enables its new DSL and built-in Kotlin by default, but
# Flutter's own Gradle plugin still needs the old DSL, and the third-party
# plugins paystack_flutter_sdk and privy_flutter still apply the Kotlin Gradle
# Plugin themselves. Setting either flag to true therefore fails the build until
# those plugins ship Built-in Kotlin support. Do not "clean these up" without
# upgrading those plugins first — Flutter emits the warning
#   "Your app uses the following plugins that apply Kotlin Gradle Plugin (KGP)"
# when that is still the case.
# Migration guide: https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-app-developers
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
