distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# Gradle 9.5.1 (already downloaded and unpacked under
# %USERPROFILE%\.gradle\wrapper\dists\gradle-9.5.1-bin) is used instead of
# services.gradle.org. This network reaches services.gradle.org slowly enough
# that pulling the ~130MB distribution times out mid-download, and the wrapper
# then re-downloads on every invocation.
#
# 9.5.1 satisfies AGP 9.0.1, which requires Gradle 9.1.0+. (The previous
# 8.10.2 pin was below AGP 8.11.1's 8.13.0 minimum and made the build fail
# before compiling anything.)
#
# NOTE: to build on another machine or on CI, switch back to the canonical URL:
#   distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.1-all.zip
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.1-bin.zip

